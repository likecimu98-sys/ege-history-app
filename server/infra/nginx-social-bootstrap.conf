# Temporary HTTP-only vhost used before the first TLS certificate is issued.
# Install as /etc/nginx/sites-enabled/obschestvo.reshay-istoriyu.ru, run
# certbot certonly --webroot -w /var/www/ege-social-app -d obschestvo.reshay-istoriyu.ru,
# then replace this file with nginx-social-site.conf.
server {
    listen 80;
    listen [::]:80;
    server_name obschestvo.reshay-istoriyu.ru;

    root /var/www/ege-social-app;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

# Заголовки безопасности для reshay-istoriyu.ru.
# Ставится на VPS как /etc/nginx/snippets/ege-security-headers.conf
#
# report-uri оставлен и в БОЕВОМ режиме намеренно. Соблазн убрать его («режим
# отчёта же кончился») стоил бы единственного способа узнать, что политика
# сломала кого-то на устройстве, которого у нас нет. Теперь отчёт означает уже не
# «нашли нарушение», а «у кого-то прямо сейчас не работает часть приложения».
#
# ⚠️ ГЛАВНАЯ ЛОВУШКА NGINX, из-за которой этот файл вообще существует.
# add_header НЕ НАКАПЛИВАЕТСЯ: если во вложенном location есть хоть один свой
# add_header, ВСЕ заголовки родительского уровня в нём пропадают. В конфиге сайта
# свой add_header есть у четырёх location (service-worker, manifest, картинки и
# `location /`), поэтому объявить заголовки один раз на уровне server нельзя —
# они не доедут ровно до тех мест, куда идут все запросы.
# Поэтому: этот снипет ОБЯЗАН быть include-нут в КАЖДЫЙ location со своим
# add_header. Добавляешь новый location с add_header — добавь и include.
#
# ⚠️ И ровно та же ловушка в обратную сторону: включая снипет в location, где
# уже стоит `Cache-Control: no-cache`, не потеряй сам no-cache. Это iOS-инвариант
# (см. AGENTS.md): без него WKWebView кэширует вход эвристически и новые деплои
# не доезжают до айфонов. Это стоило проекту недели.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# CSP. Разбор того, почему источники именно такие (аудит 26.07.2026):
#   script-src 'unsafe-inline' — в index.html есть инлайновые <script>, без них
#     не стартует заставка. 'unsafe-eval' НЕ НУЖЕН: ни eval, ни new Function нет
#     ни в нашем коде, ни в vendor/ (jspdf, qrcode, telegram-web-app — проверено).
#   img-src data: — иконки и inline-SVG; blob: — экспорт PDF.
#   connect-src — сюда же вебсокет /api/v1/store/ws и /api/v1/duels/ws.
#   frame-src 'self' — встроенная страница выполнения ДЗ cram.html; yandex.ru —
#     виджет карты в задании по географии (ui.js).
#   frame-ancestors ОБЯЗАН пускать Telegram: мини-апп живёт в iframe на
#     web.telegram.org. Уберёшь — в браузерном Telegram будет белый экран.
#   Внешних origin в клиенте больше нет: jsPDF и генератор QR перевезены в
#     vendor/ (у QR это ещё и утечка — в коде зашит одноразовый токен входа).
#
# ⚠️ static.cloudflareinsights.com в script-src и cloudflareinsights.com в
# connect-src — это НЕ наш код. Скрипт аналитики подставляет сам Cloudflare на
# границе, в исходниках его нет и аудитом кода он не находится. Поймано режимом
# Report-Only на первой же загрузке 27.07.2026. Уберёшь — молча умрёт Cloudflare
# RUM, а это один из двух источников наблюдаемости, что у проекта сейчас есть.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://reshay-istoriyu.ru wss://reshay-istoriyu.ru https://www.reshay-istoriyu.ru wss://www.reshay-istoriyu.ru https://cloudflareinsights.com; frame-src 'self' https://yandex.ru https://*.yandex.ru; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://telegram.org; base-uri 'none'; form-action 'self'; object-src 'none'; report-uri /api/v1/csp-report" always;

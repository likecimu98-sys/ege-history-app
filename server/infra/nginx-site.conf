# Боевой конфиг сайта reshay-istoriyu.ru.
# Живёт на VPS как /etc/nginx/sites-enabled/reshay-istoriyu.ru
#
# Снят с боя 26.07.2026 и внесён в git: до этого дня конфига в репозитории не
# было вообще, то есть после потери машины сайт нечем было бы поднять, а любое
# расхождение прода с репозиторием заметить было невозможно. Правишь бой —
# правь и здесь, иначе история повторится (так уже разъехался server/api/src/auth.js).
#
# Порядок правки на сервере:
#   cp /etc/nginx/sites-enabled/reshay-istoriyu.ru /root/nginx-reshay.$(date +%Y%m%d-%H%M%S).bak
#   <правка>
#   nginx -t && systemctl reload nginx
#
# ⚠️ include snippets/ege-security-headers.conf стоит в КАЖДОМ location со своим
# add_header — потому что add_header во вложенном блоке отменяет родительские.
# Подробности и последствия — в самом снипете.

server {
    server_name reshay-istoriyu.ru www.reshay-istoriyu.ru;

    root /var/www/ege-app;
    index index.html;

    # На случай location без собственного add_header (/auth/, /api/) — они
    # наследуют этот уровень.
    include snippets/ege-security-headers.conf;

    # PWA: service worker and manifest must never be cached aggressively by proxies
    location = /service-worker.js {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Static assets: long cache (SW handles versioning anyway)
    location ~* \.(png|jpg|jpeg|webp|svg|mp3|woff2?)$ {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Эндпоинт выпуска Firebase custom-token (uid=tgId) — отдельный процесс hist-token
    location /auth/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
    }

    include snippets/history-api.conf;
    include snippets/tutorapp.conf;

    location / {
        include snippets/ege-security-headers.conf;
        # no-cache for HTML entry + JS/CSS: force revalidation so new releases reach every device (esp. iOS WKWebView heuristic cache). 304 is cheap.
        # ⚠️ iOS-инвариант, см. AGENTS.md. Не убирать и не терять при правке заголовков.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/reshay-istoriyu.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reshay-istoriyu.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.reshay-istoriyu.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = reshay-istoriyu.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name reshay-istoriyu.ru www.reshay-istoriyu.ru;
    return 404; # managed by Certbot




}

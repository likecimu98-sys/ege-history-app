# Снято с боя 26.07.2026: /etc/nginx/snippets/tutorapp.conf
#
# ⚠️ ЭТО ДРУГОЕ ПРИЛОЖЕНИЕ. На том же сервере и том же домене живёт TutorApp
# (/var/www/tutorapp), у него свой набор заголовков и свой бэкенд на порту 8737.
# К «Решай Историю» он отношения не имеет — правя заголовки нашего сайта, эти
# блоки не трогай. Файл лежит в git только чтобы сервер можно было восстановить
# целиком и чтобы следующий агент не решил, будто эта часть конфига лишняя.

# TutorApp (PWA) at /tutor/ + sync API
location = /tutor { return 301 /tutor/; }
location ^~ /tutor/api/ {
    proxy_pass http://127.0.0.1:8737/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4m;
    # sync keys travel in query strings - keep them out of access logs
    access_log off;
}
location ^~ /tutor/ {
    alias /var/www/tutorapp/;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

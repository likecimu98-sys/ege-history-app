# Production vhost for the independent social-studies PWA.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name obschestvo.reshay-istoriyu.ru;

    root /var/www/ege-social-app;
    index index.html;

    include snippets/ege-security-headers.conf;

    location = /service-worker.js {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
    }

    location = /sw-recover {
        error_page 418 =418 /sw-recover.html;
        return 418;
    }

    location = /sw-recover.html {
        internal;
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|woff2?)$ {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        include snippets/ege-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;
    gzip_min_length 1024;

    ssl_certificate /etc/letsencrypt/live/obschestvo.reshay-istoriyu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obschestvo.reshay-istoriyu.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name obschestvo.reshay-istoriyu.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ege-social-app;
        default_type text/plain;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

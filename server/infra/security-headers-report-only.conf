# То же самое, но CSP в режиме ТОЛЬКО ОТЧЁТА — ничего не блокируется.
# Ставится как /etc/nginx/snippets/ege-security-headers.conf на первые сутки.
#
# Зачем отдельный файл: CSP способен превратить мини-апп в белый экран (стоит
# ошибиться во frame-ancestors) и молча убить экспорт PDF или карту. Сутки в
# режиме отчёта показывают реальные нарушения на реальных устройствах, включая
# те, до которых аудит кода не дотягивается.
#
# Отчёты собирает наш же API: POST /api/v1/csp-report пишет их в лог процесса
# hist-api (pm2 logs hist-api). Без этого эндпоинта режим отчёта бессмысленен —
# нарушения остались бы в консолях чужих телефонов, куда мы не заглянем.
#
# Через сутки: заменить содержимое снипета на security-headers.conf,
# `nginx -t`, `systemctl reload nginx`.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

#
# ⚠️ static.cloudflareinsights.com в script-src и cloudflareinsights.com в
# connect-src — это НЕ наш код. Скрипт аналитики подставляет сам Cloudflare на
# границе, в исходниках его нет и аудитом кода он не находится. Поймано режимом
# Report-Only на первой же загрузке 27.07.2026. Уберёшь — молча умрёт Cloudflare
# RUM, а это один из двух источников наблюдаемости, что у проекта сейчас есть.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://reshay-istoriyu.ru wss://reshay-istoriyu.ru https://www.reshay-istoriyu.ru wss://www.reshay-istoriyu.ru https://cloudflareinsights.com; frame-src https://yandex.ru https://*.yandex.ru; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://telegram.org; base-uri 'none'; form-action 'self'; object-src 'none'; report-uri /api/v1/csp-report" always;

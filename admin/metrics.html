<!DOCTYPE html>
<!--
  Дашборд метрик. Доступ закрывает СЕРВЕР (GET /api/v1/admin/metrics отвечает 403
  всем, кроме adminTelegramIds) — эта страница просто рисует то, что он отдал.
  Прятать саму страницу смысла нет: без прав она покажет отказ.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Метрики — Решай Историю</title>
<style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#e5e7eb; --muted:#9ca3af; --line:#2c2c2c; --accent:#60a5fa; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:14px; line-height:1.5; }
    main { max-width:900px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 4px; }
    h2 { font-size:15px; margin:28px 0 8px; }
    .sub { color:var(--muted); font-size:12px; margin:0 0 20px; }
    .scroll { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-weight:700; color:var(--muted); font-size:12px; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .msg { padding:14px; border:1px solid var(--line); border-radius:14px; color:var(--muted); }
    .err td:first-child { max-width:380px; overflow-wrap:anywhere; }
    a { color:var(--accent); }
</style>
</head>
<body>
<main>
<a href="/">← В приложение</a>
<h1>Метрики</h1>
<p class="sub">Свой сбор, без сторонних сервисов: данные касаются несовершеннолетних.</p>
<div id="out" class="msg">Загрузка…</div>
</main>
<script>
(function () {
    var out = document.getElementById('out');
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }
    function table(head, rows, cell) {
        if (!rows.length) return '<p class="sub">Пока пусто.</p>';
        return '<div class="scroll"><table><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>'
            + rows.map(cell).join('') + '</table></div>';
    }
    fetch('/api/v1/admin/metrics', { credentials: 'same-origin', cache: 'no-store' })
        .then(function (r) {
            if (r.status === 403) throw new Error('Нужны права администратора.');
            if (r.status === 401) throw new Error('Сначала войди в приложении.');
            if (!r.ok) throw new Error('Сервер ответил ' + r.status);
            return r.json();
        })
        .then(function (d) {
            var html = '';
            html += '<h2>Открытия приложения по дням (по Москве)</h2>';
            html += table(['День', 'Человек'], d.dau || [], function (r) {
                return '<tr><td>' + esc(String(r.day).slice(0, 10)) + '</td><td class="num">' + esc(r.users) + '</td></tr>';
            });

            html += '<h2>События за неделю</h2>';
            html += table(['Событие', 'Всего', 'Человек'], d.funnel || [], function (r) {
                return '<tr><td>' + esc(r.name) + '</td><td class="num">' + esc(r.total) + '</td><td class="num">' + esc(r.users) + '</td></tr>';
            });

            html += '<h2>Ошибки клиента за неделю</h2>';
            html += table(['Сообщение', 'Где', 'Платформа', 'Раз', 'Последний раз'], d.errors || [], function (r) {
                return '<tr class="err"><td>' + esc(r.message) + '</td><td>' + esc(r.source) + '</td><td>'
                    + esc(r.platform) + '</td><td class="num">' + esc(r.count) + '</td><td>'
                    + esc(String(r.last_seen_at).replace('T', ' ').slice(0, 16)) + '</td></tr>';
            });
            out.className = '';
            out.innerHTML = html;
        })
        .catch(function (e) { out.textContent = e.message || 'Не удалось загрузить.'; });
})();
</script>
</body>
</html>

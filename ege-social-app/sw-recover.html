<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Восстановление — Решай обществознание</title>
  <style>
    :root{--e-1:0 6px 20px rgba(69,45,31,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-content:center;padding:28px;background:#f7f1e8;color:#25211f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:430px;padding:28px;border:1px solid #dfd3c5;border-radius:14px;background:#fffdf9;box-shadow:var(--e-1);text-align:center}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:14px;background:#a9472b;color:#fff;font:bold 19px Georgia,serif}h1{margin:0 0 10px;font-size:27px;line-height:1.15}p{margin:0 0 18px;color:#746b64}.status{min-height:48px;padding:12px;border-radius:14px;background:#f4ece1;color:#6d2b1b;font-weight:700}button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;background:#a9472b;color:#fff;font:700 15px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">ОБ</div>
    <h1>Восстанавливаем приложение</h1>
    <p>Удаляется только старая офлайн-версия. Ваш прогресс, аккаунт и ответы остаются на месте.</p>
    <div class="status" id="status">Подождите несколько секунд…</div>
    <button id="retry" type="button" hidden>Попробовать ещё раз</button>
  </main>
  <script>
    (function(){
      'use strict';
      var status=document.getElementById('status');
      var retry=document.getElementById('retry');
      var telegram=/Telegram/i.test(navigator.userAgent||'')||Boolean(window.Telegram&&window.Telegram.WebApp);
      function timeout(promise,ms,fallback){return Promise.race([promise,new Promise(function(resolve){setTimeout(function(){resolve(fallback);},ms);})]);}
      async function recover(){
        retry.hidden=true;
        status.textContent='Удаляем старую офлайн-версию…';
        try{
          if('serviceWorker' in navigator){
            var registrations=await timeout(navigator.serviceWorker.getRegistrations(),1800,[]);
            await Promise.all(registrations.map(function(registration){return registration.unregister();}));
          }
          if('caches' in window){
            var keys=await timeout(caches.keys(),1800,[]);
            await Promise.all(keys.filter(function(key){return key.indexOf('ege-social-')===0;}).map(function(key){return caches.delete(key);}));
          }
          if(telegram){
            status.textContent='Готово. Закройте это окно и заново откройте тренажёр в боте.';
            if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();setTimeout(function(){window.Telegram.WebApp.close();},450);}
          }else{
            status.textContent='Готово. Открываем свежую версию…';
            setTimeout(function(){location.replace('/?recovery=1');},700);
          }
        }catch(error){status.textContent='Не получилось завершить восстановление. Повторите попытку.';retry.hidden=false;}
      }
      retry.addEventListener('click',recover);
      recover();
    })();
  </script>
</body>
</html>
